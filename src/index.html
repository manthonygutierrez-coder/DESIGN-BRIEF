<!doctype html>
<html lang="en" class="room-boot">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Pixel Crossing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/world.css">
<link rel="stylesheet" href="styles/desktop.css">
<link rel="stylesheet" href="styles/apps.css">
<link rel="stylesheet" href="styles/suite.css">

<link rel="stylesheet" href="styles/room.css">
<link rel="stylesheet" href="styles/frames.css">
<link rel="stylesheet" href="styles/dark.css">
</head>
<body>

<!-- The computer: everything the game draws. The room (room/main.js) puts it
     on the glass of a CRT on your desk; without the room it is the window. -->
<div id="pc">

<div class="track" id="track">

  <!-- ══════════ THE START SCREEN ══════════
       Pixel Crossing's side of the glass. The start screen itself draws on
       #fx, with its name and cards in #boot over it (crossing.js); this is
       what shows underneath before the cascade has fallen. -->
  <section class="side side--world" id="sideWorld" aria-label="Pixel Crossing"></section>

  <!-- ══════════ THE SCREEN ══════════ -->
  <section class="side side--screen" id="sideScreen" aria-label="The screen">
    <div class="room"><div class="room__in" id="roomIn">
      <div class="plane plane--back"></div>
      <div class="plane plane--floor"></div>
      <div class="plane plane--ceil"></div>
      <div class="plane plane--l"></div>
      <div class="plane plane--r"></div>
    </div></div>
    <div class="horizon"></div>
    <div class="bloom"></div>

    <div class="desktop" id="desk">
      <div class="icons" id="icons"></div>
      <div class="wins" id="wins"></div>
      <p class="deskhint">DOUBLE-CLICK A BRIEF</p>
    </div>

    <div class="smenu" id="smenu" role="menu" aria-label="Start">
      <div class="sbanner"><span>BRIEFS</span></div>
      <div class="slist" id="slist"></div>
    </div>

    <div class="taskbar">
      <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false" aria-controls="smenu">
        <span id="startIco"></span>Start
      </button>
      <span class="tdiv"></span>
      <div class="tasks" id="tasks"></div>
      <div class="tray"><span id="clock">--:--</span></div>
    </div>

    <div class="scan"></div>
    <div class="crt"></div>
  </section>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="boot" id="boot" hidden></div>

</div>
