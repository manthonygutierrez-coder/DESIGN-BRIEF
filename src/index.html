<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Pixel Crossing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/world.css">
<link rel="stylesheet" href="styles/desktop.css">
<link rel="stylesheet" href="styles/apps.css">
</head>
<body>

<div class="track" id="track">

  <!-- ══════════ THE WORLD ══════════ -->
  <section class="side side--world" id="sideWorld" aria-label="The world">
    <div class="scenes" id="scenes">

      <div class="scene" data-scene="graphic">
        <div class="s-bg" style="background:radial-gradient(118% 96% at 32% 18%,#FFF8EB 0%,#EFE2CE 46%,#D8C5AA 100%)"></div>
        <div class="g-half"></div><div class="g-disc"></div><div class="g-bar"></div>
      </div>

      <div class="scene" data-scene="webui">
        <div class="s-bg" style="background:linear-gradient(158deg,#EDF3F8 0%,#C6D9E8 52%,#8FAFCB 100%)"></div>
        <div class="pane p1"></div><div class="pane p2"></div><div class="pane p3"></div><div class="pane p4"></div>
        <div class="beam"></div>
      </div>

      <div class="scene" data-scene="asset3d">
        <div class="s-bg" style="background:radial-gradient(88% 78% at 26% 16%,#F0EAE1 0%,#CFC5B8 46%,#8A8279 100%)"></div>
        <svg class="wire" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="50" cy="50" rx="46" ry="17"></ellipse>
          <ellipse cx="50" cy="50" rx="46" ry="17" transform="rotate(60 50 50)"></ellipse>
          <ellipse cx="50" cy="50" rx="46" ry="17" transform="rotate(120 50 50)"></ellipse>
        </svg>
        <div class="cast"></div><div class="sphere"></div>
      </div>

      <div class="scene" data-scene="illustrative">
        <div class="s-bg" style="background:radial-gradient(110% 90% at 60% 30%,#FBF6EA 0%,#F0E6D2 55%,#DFCEB2 100%)"></div>
        <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
        <svg class="stroke" viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true">
          <path d="M4 88 C34 26 68 14 104 30 C136 44 148 82 186 60 L188 68 C146 96 128 58 100 44 C72 30 44 44 12 96 Z"></path>
        </svg>
      </div>

      <div class="scene" data-scene="character">
        <div class="s-bg" style="background:radial-gradient(76% 68% at 50% 56%,#7A4A1C 0%,#4A2A11 46%,#1E1108 100%)"></div>
        <div class="halo"></div>
        <svg class="gest" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="50" cy="50" rx="44" ry="30" transform="rotate(18 50 50)"></ellipse>
          <ellipse cx="50" cy="50" rx="38" ry="44" transform="rotate(-24 50 50)"></ellipse>
        </svg>
        <svg class="fig" viewBox="0 0 200 320" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
          <path d="M100 34c-21 0-35 15-36 33-1 13 4 22 9 27-19 7-33 22-38 43-6 24-9 55-10 87-1 34-1 68-1 96h152c0-28 0-62-1-96-1-32-4-63-10-87-5-21-19-36-38-43 5-5 10-14 9-27-1-18-15-33-36-33z"></path>
        </svg>
      </div>

      <div class="scene" data-scene="motion">
        <div class="s-bg" style="background:radial-gradient(90% 80% at 42% 52%,#101A22 0%,#070C11 55%,#020406 100%)"></div>
        <div class="streak fat" style="--c:#57E0FF;--d:9s;top:26%"></div>
        <div class="streak" style="--c:#57E0FF;--d:7s;top:30%"></div>
        <div class="streak" style="--c:#FF5FA8;--d:11s;top:44%"></div>
        <div class="streak fat" style="--c:#FF5FA8;--d:15s;top:47%"></div>
        <div class="streak" style="--c:#FFE08A;--d:6s;top:62%"></div>
        <div class="streak" style="--c:#57E0FF;--d:13s;top:71%"></div>
        <div class="streak fat" style="--c:#7C5CFF;--d:18s;top:76%"></div>
      </div>

      <div class="scene" data-scene="type">
        <div class="s-bg" style="background:linear-gradient(178deg,#3A4247 0%,#272D31 60%,#171B1E 100%)"></div>
        <div class="guides"></div>
        <div class="chip"></div>
        <div class="glyph">&amp;</div>
      </div>

    </div>
    <div class="grain"></div>
    <div class="vig"></div>
    <div class="wscrim"></div>
    <div class="edge"></div>

    <div class="wchrome" id="wchrome">
      <div class="wtop">
        <p class="eyebrow">This side &mdash; the world</p>
        <h1 class="wtitle" id="wTitle">Graphic Design</h1>
        <p class="wconcept" id="wConcept">Ink under pressure</p>
      </div>
      <div class="wbot">
        <div class="picker" id="picker">
          <button class="picker__btn" id="pickerBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="pickerList">
            <span class="picker__k">DISCIPLINE</span>
            <span class="picker__v" id="pickerVal">Graphic Design</span>
            <span class="picker__c" aria-hidden="true">&#9660;</span>
          </button>
          <ul class="picker__list" id="pickerList" role="listbox" aria-label="Discipline" tabindex="-1"></ul>
        </div>
        <p class="hint">Choose one &mdash; you&rsquo;ll be sent through</p>
      </div>
    </div>
  </section>

  <!-- ══════════ THE SCREEN ══════════ -->
  <section class="side side--screen" id="sideScreen" aria-label="The screen">
    <div class="room"><div class="room__in" id="roomIn">
      <div class="plane plane--back"></div>
      <div class="plane plane--floor"></div>
      <div class="plane plane--ceil"></div>
      <div class="plane plane--l"></div>
      <div class="plane plane--r"></div>
    </div></div>
    <div class="horizon"></div>
    <div class="bloom"></div>

    <div class="desktop" id="desk">
      <div class="icons" id="icons"></div>
      <div class="wins" id="wins"></div>
      <p class="deskhint">DOUBLE-CLICK A BRIEF</p>
    </div>

    <div class="smenu" id="smenu" role="menu" aria-label="Start">
      <div class="sbanner"><span>BRIEFS</span></div>
      <div class="slist" id="slist"></div>
    </div>

    <div class="taskbar">
      <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false" aria-controls="smenu">
        <span id="startIco"></span>Start
      </button>
      <span class="tdiv"></span>
      <div class="tasks" id="tasks"></div>
      <div class="tray"><span id="clock">--:--</span></div>
    </div>

    <div class="scan"></div>
    <div class="crt"></div>
  </section>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- Classic scripts, loaded in order: they share one global scope, exactly as
     they did in the single-file artifact. Do not convert to modules without
     rewiring every cross-file reference. -->
<script src="js/bridge.js"></script>
<script src="js/briefs.js"></script>
<script src="js/content/clients.js"></script>
<script src="js/content/marks.js"></script>
<script src="js/content/imagery.js"></script>
<script src="js/content/sites.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/icons.js"></script>
<script src="js/wm.js"></script>
<script src="js/brief-doc.js"></script>
<script src="js/shell.js"></script>
<script src="js/mail.js"></script>
<script src="js/browser.js"></script>
<script src="js/feed.js"></script>
<script src="js/crossing.js"></script>
<script src="js/app.js"></script>
</body>
</html>
