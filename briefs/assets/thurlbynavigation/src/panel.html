<!doctype html><html lang="en-GB"><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body{width:800px}
  .frame{width:800px;height:600px;background:#D9D2C4;position:relative;overflow:hidden}
  /* weather hood + post */
  .hood{position:absolute;left:34px;top:30px;width:732px;height:26px;background:var(--brand);
        border-radius:4px 4px 0 0}
  .hood b{position:absolute;left:16px;top:6px;font-size:10.5px;letter-spacing:.17em;
          text-transform:uppercase;color:#A9C4B7;font-weight:700}
  .hood i{position:absolute;right:16px;top:6px;font-size:10.5px;letter-spacing:.17em;
          text-transform:uppercase;color:#A9C4B7;font-style:normal}
  .bezel{position:absolute;left:34px;top:56px;width:732px;height:462px;background:#2A2A26;
         padding:15px;border-radius:0 0 4px 4px}
  .post{position:absolute;left:376px;top:518px;width:48px;height:82px;background:#8E8676}
  .post:after{content:"";position:absolute;left:-26px;top:58px;width:100px;height:24px;background:#7C7464}
  .screen{width:702px;height:432px;background:#1B2320;position:relative;overflow:hidden}
</style>
<div class="frame">
  <div class="hood"><b>Lock 6 — Staircase, lower</b><i>Head, offside</i></div>
  <div class="post"></div>
  <div class="bezel">
    <svg class="screen" viewBox="0 0 800 492" xmlns="http://www.w3.org/2000/svg">
      <!-- panel ground -->
      <rect width="800" height="492" fill="#1B2320"/>

      <!-- top rule + step counter -->
      <rect x="44" y="44" width="712" height="3" fill="#39463F"/>
      <text x="44" y="34" font-family="Liberation Sans, sans-serif" font-size="19"
            letter-spacing="5" fill="#8CA096" font-weight="bold">STEP 4 OF 11</text>
      <text x="756" y="34" text-anchor="end" font-family="Liberation Sans, sans-serif"
            font-size="19" letter-spacing="5" fill="#8CA096" font-weight="bold">INTO LOCK 6</text>

      <!-- Section through the staircase: lock 7 (left, full) draining into lock 6
           (right, rising). Trailing frames sit where the water has come from. -->
      <g transform="translate(0,-30)">
        <!-- bed and chamber walls -->
        <rect x="68" y="392" width="664" height="14" fill="#46554D"/>
        <rect x="68" y="150" width="14" height="242" fill="#46554D"/>
        <rect x="718" y="150" width="14" height="242" fill="#46554D"/>

        <!-- lock 7: falling, ghosts above where it was -->
        <rect x="82" y="196" width="278" height="196" fill="#2E4A3E" opacity=".3"/>
        <rect x="82" y="214" width="278" height="178" fill="#2E4A3E" opacity=".55"/>
        <rect x="82" y="232" width="278" height="160" fill="#3E6B58"/>

        <!-- lock 6: rising, ghosts below where it was -->
        <rect x="396" y="348" width="322" height="44" fill="#2E4A3E" opacity=".3"/>
        <rect x="396" y="330" width="322" height="62" fill="#2E4A3E" opacity=".55"/>
        <rect x="396" y="312" width="322" height="80" fill="#3E6B58"/>

        <!-- the gate between them -->
        <rect x="360" y="142" width="36" height="206" fill="#C87E24"/>
        <!-- ground paddle, open: culvert through the gate, flow left to right -->
        <rect x="360" y="348" width="36" height="44" fill="#1B2320"/>
        <path d="M300 370 h96 v-20 l44 30 -44 30 v-20 h-96z" fill="#C87E24"/>

        <!-- paddle rod drawn up: three frames, newest solid -->
        <rect x="366" y="196" width="24" height="64" fill="#C87E24" opacity=".28"/>
        <rect x="366" y="172" width="24" height="64" fill="#C87E24" opacity=".55"/>
        <rect x="366" y="148" width="24" height="64" fill="#EDE6D6"/>
        <rect x="352" y="132" width="52" height="16" fill="#EDE6D6"/>
      </g>

      <!-- caption: five words -->
      <text x="44" y="452" font-family="Liberation Sans, sans-serif" font-size="46"
            font-weight="bold" letter-spacing="1" fill="#EDE6D6">RAISE THE GROUND PADDLE</text>
      <text x="44" y="482" font-family="Liberation Sans, sans-serif" font-size="25"
            letter-spacing="9" fill="#C87E24" font-weight="bold">SLOWLY</text>

      <!-- step pips -->
      <g>
        <rect x="474" y="462" width="36" height="9" fill="#3A4741"/>
        <rect x="518" y="462" width="36" height="9" fill="#3A4741"/>
        <rect x="562" y="462" width="36" height="9" fill="#3A4741"/>
        <rect x="606" y="462" width="36" height="9" fill="#C87E24"/>
        <rect x="650" y="462" width="36" height="9" fill="#2A342F"/>
        <rect x="694" y="462" width="36" height="9" fill="#2A342F"/>
        <rect x="738" y="462" width="18" height="9" fill="#2A342F"/>
      </g>
    </svg>
  </div>
</div>
