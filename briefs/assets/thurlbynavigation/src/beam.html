<!doctype html><html lang="en-GB"><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>body{width:800px} .frame{width:800px;height:600px;overflow:hidden}
  text{font-family:"Liberation Sans",Arial,sans-serif}</style>
<div class="frame">
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- towpath, coping, water -->
  <rect width="800" height="600" fill="#DCD6C8"/>
  <rect y="404" width="800" height="196" fill="#C4BCA6"/>
  <rect y="404" width="800" height="5" fill="#ADA38A"/>
  <rect y="486" width="800" height="3" fill="#B7AE97"/>
  <rect y="530" width="800" height="70" fill="#2C5445"/>
  <rect y="530" width="800" height="4" fill="#3E6B58"/>

  <!-- pivot post at the heel end -->
  <rect x="690" y="352" width="46" height="188" fill="#2A2A26"/>
  <rect x="676" y="338" width="74" height="30" fill="#3A3A34"/>

  <g transform="rotate(-1.8 400 290)">
    <!-- the beam -->
    <rect x="40" y="228" width="720" height="124" fill="#EFEAE0"/>
    <rect x="40" y="228" width="720" height="9" fill="#FFFDF7"/>
    <rect x="40" y="337" width="720" height="15" fill="#CFC6B4"/>

    <!-- banded tip, canal convention -->
    <rect x="40" y="228" width="46" height="124" fill="#16191A"/>
    <rect x="100" y="228" width="46" height="124" fill="#16191A"/>

    <!-- lock number, stencilled -->
    <text x="168" y="322" font-size="86" font-weight="bold" fill="#C87E24">6</text>

    <!-- the instruction -->
    <text x="252" y="294" font-size="25" font-weight="bold" letter-spacing="1.2"
          fill="#16191A">EMPTY UPPER CHAMBER FIRST</text>
    <text x="252" y="324" font-size="12" letter-spacing="4" fill="#5E5A4E">STAIRCASE
      · NO POUND BETWEEN 6 AND 7</text>

    <!-- the mark, painted at the heel -->
    <g transform="translate(686 262) scale(0.78)">
      <rect x="5" y="16" width="25" height="42" fill="#1E4B3C"/>
      <rect x="34" y="38" width="25" height="20" fill="#1E4B3C"/>
      <rect x="27" y="6" width="9" height="52" fill="#C87E24"/>
    </g>
  </g>
</svg>
</div>
