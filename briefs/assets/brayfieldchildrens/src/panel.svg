<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Element — the backlit ceiling panel above scanner two, seen from the
       table. Printed one ink on the diffuser: at 8 lux a mid-tone is nothing.
       Six marks along the foot, one per sequence, filled as they are run. -->

  <!-- the dark room and the suspended grid -->
  <rect width="800" height="600" fill="#0D1417"/>
  <g stroke="#243036" stroke-width="6">
    <path d="M0 96h800M0 504h800M112 0v600M688 0v600"/>
  </g>
  <g stroke="#1A242A" stroke-width="2">
    <path d="M0 40h800M0 560h800M56 0v600M744 0v600"/>
  </g>

  <!-- the panel -->
  <rect x="128" y="104" width="544" height="392" rx="4" fill="#F6F1E2"/>
  <rect x="128" y="104" width="544" height="392" rx="4" fill="none" stroke="#C9C2AE" stroke-width="3"/>

  <!-- the one who is also holding still -->
  <g transform="translate(280 168) scale(1.2)" fill="#16242B">
    <circle cx="14" cy="132" r="17"/>
    <circle cx="186" cy="132" r="17"/>
    <rect x="52" y="174" width="38" height="18" rx="9"/>
    <rect x="110" y="174" width="38" height="18" rx="9"/>
    <path d="M20 170V100a80 80 0 0 1 160 0v70a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10z"/>
    <g stroke="#F6F1E2" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M62 114q12-13 24 0"/>
      <path d="M114 114q12-13 24 0"/>
      <path d="M78 146h44"/>
    </g>
  </g>

  <!-- sequence marks: solid is run, outline is still to come -->
  <g fill="#16242B">
    <rect x="228" y="440" width="44" height="9" rx="4.5"/>
    <rect x="288" y="440" width="44" height="9" rx="4.5"/>
    <rect x="348" y="440" width="44" height="9" rx="4.5"/>
    <rect x="408" y="440" width="44" height="9" rx="4.5"/>
  </g>
  <g fill="none" stroke="#16242B" stroke-width="2.5">
    <rect x="468" y="440" width="44" height="9" rx="4.5"/>
    <rect x="528" y="440" width="44" height="9" rx="4.5"/>
  </g>
</svg>
